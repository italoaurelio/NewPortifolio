<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140f0b" />
    <title>Reino Infinito — Portal Runner</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #140f0b;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Edge-to-edge fullscreen canvas (no frame). */
      #game canvas {
        display: block;
      }
      /* Simple loading state before Phaser boots */
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        color: #c99a4a;
        font-weight: 700;
        letter-spacing: 2px;
        z-index: 10;
        transition: opacity 0.3s;
      }
      #loader .ring {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(201, 154, 74, 0.2);
        border-top-color: #c99a4a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-4iAvvvK0.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-CaWnzXme.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="loader">
      <div class="ring"></div>
      <div>CARREGANDO</div>
    </div>
  </body>
</html>
