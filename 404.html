<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0e1315" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e9ecea" media="(prefers-color-scheme: light)">
    <title>Faixa não encontrada | Ítalo Aurélio</title>
    <link rel="icon" href="/assets/italoaurelio.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Bodoni+Moda:ital,opsz,wght@1,6..96,900&family=DM+Serif+Display&family=Rubik+Mono+One&display=swap&text=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz%C3%81%C3%82%C3%83%C3%89%C3%8A%C3%8D%C3%93%C3%94%C3%95%C3%9A%C3%87%C3%91%C3%A1%C3%A2%C3%A3%C3%A9%C3%AA%C3%AD%C3%B3%C3%B4%C3%B5%C3%BA%C3%A7%C3%B1"
        rel="stylesheet">
    <!-- caminhos absolutos: a 404 aparece em qualquer URL, até /a/b/c 🧭 -->
    <link rel="stylesheet" href="/style.css?v=202609222028">
    <style>
        .nf {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 48px 16px;
            text-align: center;
        }

        .nf-inner {
            display: grid;
            justify-items: center;
            gap: 28px;
            max-width: 640px;
        }

        /* o disco arranhado: gira, engasga, volta um pouco, gira de novo */
        .nf-disc {
            position: relative;
            width: min(62vw, 300px);
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                conic-gradient(from 20deg, transparent 0 10%, rgb(255 255 255 / 0.14) 15%, transparent 21% 57%, rgb(255 255 255 / 0.12) 62%, transparent 68%),
                repeating-radial-gradient(circle, #060708 0 2px, #1d2225 2.5px 3.5px);
            box-shadow: var(--shadow), 0 0 0 1px rgb(255 255 255 / 0.08);
            animation: skip 2.4s steps(1, end) infinite, wobble 2.4s var(--ease) infinite;
        }

        .nf-disc::before {
            content: "404";
            position: absolute;
            inset: 32%;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: #0e1315;
            font-family: var(--f-mono);
            font-weight: 500;
            font-size: clamp(1rem, 4vw, 1.4rem);
        }

        .nf-disc::after {
            content: "";
            position: absolute;
            inset: 48.5%;
            border-radius: 50%;
            background: #060708;
        }

        /* arranhões: riscos curtos e tortos, girando junto com o disco */
        .scratch {
            position: absolute;
            height: 1.5px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, rgb(236 235 230 / 0.5) 30%, rgb(236 235 230 / 0.2) 80%, transparent);
            transform-origin: left center;
            pointer-events: none;
        }

        .scratch.s1 { left: 14%; top: 30%; width: 34%; rotate: 24deg; }
        .scratch.s2 { left: 58%; top: 72%; width: 22%; rotate: -38deg; opacity: 0.7; }
        .scratch.s3 { left: 66%; top: 24%; width: 14%; rotate: 70deg; opacity: 0.5; }

        @keyframes wobble {
            0% { rotate: 0deg; }
            30% { rotate: 110deg; }
            34% { rotate: 96deg; }
            38% { rotate: 110deg; }
            42% { rotate: 96deg; }
            70% { rotate: 250deg; }
            74% { rotate: 236deg; }
            100% { rotate: 360deg; }
        }

        @keyframes skip {
            0%, 100% { translate: 0 0; }
            33% { translate: 2px -1px; }
            41% { translate: -2px 1px; }
            73% { translate: 1px 1px; }
        }

        .nf-title {
            font-size: clamp(2.2rem, 8vw, 4.6rem);
            justify-content: center;
        }

        .nf-sub {
            color: var(--muted);
            font-size: 1.1rem;
        }

        @media (prefers-reduced-motion: reduce) {
            .nf-disc { animation: none; }
        }
    </style>
</head>

<body>
    <canvas id="bg-waves" aria-hidden="true"></canvas>
    <main class="nf">
        <div class="nf-inner">
            <div class="nf-disc" aria-hidden="true"><span class="scratch s1"></span><span class="scratch s2"></span><span class="scratch s3"></span></div>
            <h1 class="nf-title ransom" data-i18n="nf.title">Faixa não encontrada</h1>
            <p class="nf-sub" data-i18n="nf.sub">O disco pulou. Essa página não existe ou mudou de lugar.</p>
            <a class="btn btn-accent" href="/">
                <iconify-icon icon="ph:arrow-counter-clockwise-bold" aria-hidden="true"></iconify-icon>
                <span data-i18n="nf.back">Voltar pro começo do disco</span>
            </a>
        </div>
    </main>
    <div class="grain" aria-hidden="true"></div>

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>
    <script src="/i18n.js?v=202609222028"></script>
    <script src="/ransom.js?v=202609222028"></script>
    <script>
        // a 404 só precisa de idioma + recorte 🎶
        document.addEventListener("langchange", ransomizeAll);
    </script>
    <script src="/bg.js?v=202609222028" defer></script>
</body>

</html>
